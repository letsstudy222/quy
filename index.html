<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#33307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quỹ">
<meta name="robots" content="noindex, nofollow">
<title>Quỹ tiền</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  --field:#EFF2F8; --panel:#FFFFFF; --panel2:#F6F7FB;
  --ink:#1E2235; --ink2:#4A5068; --muted:#7A8099;
  --rule:#E2E6F0; --rule2:#EEF1F6;
  --carbon:#5B4FE0; --carbon-s:#EEECFD; --carbon-d:#4A3FC8;
  --red:#D9425B; --red-s:#FDECEF; --red-b:#F7CDD5;
  --amber:#E8710A; --amber-s:#FFF1E3; --amber-b:#FAD7B5;
  --green:#0F9D6E; --green-s:#E3F6EE; --green-b:#BDE8D5;
  --blue:#2563EB; --blue-s:#E8F0FE; --blue-b:#C9DAFB;
  --pink:#C026D3; --pink-s:#FAE8FC; --pink-b:#F0C4F5;
  --teal:#0891B2; --teal-s:#E2F5FA;
  --shadow: 0 1px 2px rgba(42,40,57,.04), 0 6px 18px rgba(42,40,57,.055);
  --shadow-lg: 0 24px 60px rgba(42,40,57,.22);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --cond: "Arial Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--field); color: var(--ink);
  min-height: 100vh; font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; padding-bottom: 60px;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--carbon); outline-offset: 2px; border-radius: 8px; }
svg { flex: none; }
.hide { display: none !important; }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--rule); }
.hdr-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 7px; margin-right: auto; min-width: 0; }
.mark { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .1em;
  background: var(--carbon); color: #fff; padding: 3px 6px 2px; border-radius: 5px; }
.wordmark { font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .16em;
  text-transform: uppercase; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px;
  border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; color: var(--ink2); background: var(--panel2); white-space: nowrap; }
.chip:hover { border-color: var(--carbon); color: var(--carbon); }
.icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 11px; color: var(--ink2); }
.icon:hover { background: var(--panel2); color: var(--ink); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px;
  border: 1px solid var(--rule); padding: 4px 10px; color: var(--muted); background: var(--panel2); }
.sync .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--muted); }
.sync.on { color: var(--green); border-color: var(--green-b); background: var(--green-s); }
.sync.on .dot { background: var(--green); }
.sync.busy { color: var(--carbon); background: var(--carbon-s); }
.sync.busy .dot { background: var(--carbon); animation: pulse 1s ease-in-out infinite; }
.sync.err { color: var(--red); border-color: var(--red-b); background: var(--red-s); }
.sync.err .dot { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 560px) { .sync-lbl, .wordmark { display: none; } }

/* tabs */
.tabs { max-width: 1080px; margin: 0 auto; display: flex; gap: 2px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px 11px; font-size: 13px; font-weight: 600;
  color: var(--ink2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--tc, var(--carbon)); border-bottom-color: var(--tc, var(--carbon)); }
.tab.on svg { stroke: var(--tc, var(--carbon)); }

/* layout */
.wrap { max-width: 1080px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.wrap > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp { margin-left: auto; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.mid { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.sub { color: var(--ink2); font-family: var(--mono); font-size: 13px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.neg { color: var(--red) !important; }
.pos { color: var(--green); }
.hero { background: linear-gradient(135deg, #312E81 0%, #5B4FE0 55%, #8B5CF6 100%); color: #fff; border: none; box-shadow: 0 10px 30px rgba(91,79,224,.28); }
.hero .lbl { color: rgba(255,255,255,.7); }
.hero .sub { color: rgba(255,255,255,.85); }
.hero .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.25); }
.hero .btn.primary { background: #fff; color: var(--carbon-d); border-color: #fff; }
.fund { position: relative; overflow: hidden; background: linear-gradient(165deg, var(--cs, #fff) 0%, #fff 60%); border-color: var(--cb, var(--rule)); }
.fund .pct { background: #fff; border-color: var(--cb, var(--rule)); color: var(--c); font-weight: 700; }
.fund .mid { color: var(--c); }
.fund .mid.neg { color: var(--red); }
.fund::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--carbon)); }
.fund .tag { display: inline-flex; align-items: center; gap: 6px; }
.goal { border: 1px solid var(--rule); border-left: 4px solid var(--green); border-radius: 14px; padding: 14px; background: var(--panel); }
.goal.done { border-color: var(--green-b); background: var(--green-s); }
.goal h4 { margin: 0; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal .gh { display: flex; align-items: center; gap: 8px; }
.goal .gh .badge { flex: none; }
.goal .gh .acts { display: flex; margin-left: auto; flex: none; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--rule); color: var(--ink2); }
.badge.ok { background: var(--green); border-color: var(--green); color: #fff; }
.badge.late { background: var(--red-s); border-color: var(--red-b); color: var(--red); }
.need { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
.need > div { background: var(--amber-s); border: 1px solid var(--amber-b); border-radius: 10px; padding: 8px 10px; }
.need .lbl { color: var(--amber); }
.need b { color: #9A4A05; display: block; font-family: var(--mono); font-size: 13.5px; }
.need small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
select.in { appearance: auto; }
.mini { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
.mini .prog { flex: 1; margin: 0; height: 6px; }
.mini span:first-child { width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
.dep { border-top: 1px dashed var(--rule); margin-top: 10px; padding-top: 8px; }
.dep .li { padding: 8px 0; }
.dep .li .t2, .dep .li .t1 { white-space: normal; }
.proj { color: #0B5E43; background: var(--green-s); border: 1px solid var(--green-b); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
.proj b { font-family: var(--mono); }
/* máy tính lãi */
.calcbox { border-color: var(--pink-b); background: linear-gradient(165deg, var(--pink-s) 0%, #fff 55%); }
.calcbox > summary { color: var(--pink); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.kres { margin-top: 14px; border-radius: 14px; padding: 14px; color: #fff; background: linear-gradient(135deg, #86198F, #C026D3 60%, #E879F9); }
.kres .lbl { color: rgba(255,255,255,.75); }
.kres .big { font-size: 28px; }
.kres .sub { color: rgba(255,255,255,.88); }
.kstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.kstats > div { background: rgba(255,255,255,.14); border-radius: 10px; padding: 8px 10px; }
.kstats b { display: block; font-family: var(--mono); font-size: 14px; }
.kstats small { color: rgba(255,255,255,.8); font-size: 11.5px; }
.ktab { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
.ktab th { text-align: right; font-size: 11px; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--rule); }
.ktab td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--rule2); font-family: var(--mono); }
.ktab th:first-child, .ktab td:first-child { text-align: left; }
.ktab td.g { color: var(--green); }
.mseg { display: flex; flex-wrap: wrap; gap: 6px; }
.mseg button { padding: 7px 11px; border-radius: 10px; border: 1px solid var(--rule); background: #fff; font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.mseg button.on { background: var(--pink); border-color: var(--pink); color: #fff; }
.pct { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--rule); color: var(--ink2); }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-top: 1px dashed var(--rule); color: var(--ink2); }
.kv b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
.prog { height: 10px; background: var(--rule2); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.prog { position: relative; }
.prog i.pj { position: absolute; left: 0; top: 0; background: var(--green-b); }
.prog i { position: relative; display: block; height: 100%; background: linear-gradient(90deg, #10B981, var(--green)); border-radius: 999px; transition: width .4s; }

/* buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 11px;
  border: 1px solid var(--rule); background: var(--panel); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--carbon); color: var(--carbon); }
.btn.primary { background: var(--carbon); border-color: var(--carbon); color: #fff; }
.btn.primary:hover { background: var(--carbon-d); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red-b); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; }
.btn.block { width: 100%; }
.fl { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin: 12px 0 5px; }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 11px; background: var(--panel2); font-size: 15px; }
.in:focus { outline: none; border-color: var(--carbon); background: #fff; }
.in.mono { font-family: var(--mono); }
.ig { display: flex; gap: 6px; }
.ig .in { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 11px; overflow: hidden; flex: none; }
.seg button { padding: 0 12px; font-weight: 700; font-size: 12.5px; color: var(--muted); background: var(--panel2); }
.seg button.on { background: var(--carbon); color: #fff; }
.calc { font-size: 12.5px; color: var(--ink2); margin-top: 6px; font-family: var(--mono); min-height: 18px; }
.split3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.split3 > div { border: 1px solid var(--rule); border-radius: 12px; padding: 9px 10px; background: var(--panel2); }
.split3 .lbl { font-size: 10px; }
.split3 b { display: block; font-family: var(--mono); font-size: 14px; margin-top: 2px; word-break: break-all; }
@media (max-width: 420px) { .split3 { grid-template-columns: 1fr; } }
.banner { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 11px; font-size: 13px;
  background: var(--red-s); color: var(--red); border: 1px solid var(--red-b); }
.banner.info { background: var(--amber-s); color: var(--amber); border-color: var(--amber-b); }

/* collapsible */
details.box { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
details.box > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
details.box[open] > summary .chev { transform: rotate(180deg); }
details.box > summary .cnt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-weight: 500; }
details.box .body { padding: 0 16px 14px; }

/* list */
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule2); }
.li:first-child { border-top: none; }
.li .ico { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.li .t { flex: 1; min-width: 0; }
.li .t1 { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .amt { text-align: right; font-family: var(--mono); font-weight: 600; font-size: 13.5px; }
.li .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.li .acts { display: flex; gap: 2px; }
.li .acts .icon { width: 30px; height: 30px; }
.li.off { opacity: .45; }
.li.off .amt { text-decoration: line-through; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; text-align: center; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.fchip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule); font-size: 12.5px; font-weight: 600; color: var(--ink2); background: var(--panel2); }
.fchip.on { background: var(--carbon); border-color: var(--carbon); color: #fff; }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(30,28,50,.42); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .ov { align-items: center; } }
.sheet { background: var(--panel); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg); padding: 18px 18px 20px; }
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet .foot { display: flex; gap: 8px; margin-top: 18px; }
.sheet .foot .btn { flex: 1; }
.sqlbox { font-family: var(--mono); font-size: 11.5px; white-space: pre; overflow-x: auto; background: #26243A; color: #E6E4F5;
  padding: 12px; border-radius: 11px; margin-top: 8px; max-width: 100%; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 60;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; transition: .25s; pointer-events: none; max-width: 92vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.center { width: 100%; max-width: 440px; margin: 24px auto; }
.steps p { margin: 8px 0; font-size: 13.5px; color: var(--ink2); }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand"><span class="mark">QUỸ</span><span class="wordmark">Quản lý quỹ</span></div>
    <button class="icon" data-act="eye" id="eyeBtn" title="Bấm để ẩn/hiện số tiền"></button>
    <button class="chip" data-act="rate" title="Tỷ giá USD → VND"><span data-ic="coins"></span><span id="rateChip">—</span></button>
    <button class="sync" id="syncChip" data-act="resync" title="Đồng bộ"><span class="dot"></span><span class="sync-lbl" id="syncLbl">Chưa đăng nhập</span></button>
    <button class="icon" data-act="settings" title="Cài đặt"><span data-ic="gear"></span></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="wrap" id="view"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============ CẤU HÌNH — cùng Supabase với web Sổ thuê tài khoản ============ */
  var SUPABASE_URL = "https://ryqqestvrbuxjyaewwpw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_wAbx1FVWMiIbq4QRTpSccA_O6cPwn8K";
  var OLD_CLOUD_KEY = "acct-rental-cloud-v1";   /* chỉ dùng để điền sẵn email */
  var CKEY = "quy-cloud-v1";
  var DKEY = "quy-data-v1:";
  var UKEY = "quy-ui-v1";

  var SQL =
    "create table if not exists public.funds (\n" +
    "  user_id uuid primary key references auth.users(id) on delete cascade,\n" +
    "  data jsonb not null default '{}'::jsonb,\n" +
    "  updated_at timestamptz not null default now()\n);\n\n" +
    "alter table public.funds enable row level security;\n\n" +
    "drop policy if exists \"funds_select\" on public.funds;\n" +
    "drop policy if exists \"funds_insert\" on public.funds;\n" +
    "drop policy if exists \"funds_update\" on public.funds;\n\n" +
    "create policy \"funds_select\" on public.funds\n  for select using (auth.uid() = user_id);\n" +
    "create policy \"funds_insert\" on public.funds\n  for insert with check (auth.uid() = user_id);\n" +
    "create policy \"funds_update\" on public.funds\n  for update using (auth.uid() = user_id)\n  with check (auth.uid() = user_id);";

  /* ============ tiện ích ============ */
  var canStore = true;
  try { localStorage.setItem("__q", "1"); localStorage.removeItem("__q"); } catch (e) { canStore = false; }
  function lsGet(k) { try { return canStore ? localStorage.getItem(k) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (canStore) localStorage.setItem(k, v); } catch (e) {} }

  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function dmy(s) { if (!s) return ""; var p = String(s).slice(0, 10).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function hhmm() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function r2(n) { return Math.round(num(n) * 100) / 100; }

  var NFV = new Intl.NumberFormat("vi-VN");
  var NFU = new Intl.NumberFormat("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  var HID = "••••••";
  function vnd(n, force) { if (UI.hide && !force) return HID + " ₫"; var v = Math.round(num(n)); return (v < 0 ? "−" : "") + NFV.format(Math.abs(v)) + " ₫"; }
  function usd(n, force) { if (UI.hide && !force) return "$" + HID; var v = r2(n); return (v < 0 ? "−" : "") + "$" + NFU.format(Math.abs(v)); }
  function rate() { return num(D.rate) > 0 ? num(D.rate) : 26000; }

  /* đọc số người dùng nhập: VND bỏ hết dấu; USD chấp nhận 1,234.5 hoặc 1234,5 */
  function parseAmt(s, cur) {
    s = String(s || "").replace(/\s|\$|₫|đ|vnd|usd/gi, "");
    if (!s) return 0;
    if (cur === "VND") return num(s.replace(/[^\d-]/g, ""));
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) s = s.replace(/,/g, "");
    else if (/^\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, "");
    else s = s.replace(",", ".");

  function allPayLogs(accounts) {

  /* Đối chiếu: khoản mới (không nằm trong mốc ban đầu) → thêm; khoản bị hoàn tác bên web cũ → bỏ.
     Nếu tài khoản bị xoá hẳn bên web cũ thì GIỮ lại khoản đã trừ (tiền thực tế đã trả). */
  function reconcile(accounts) {
    var logs = allPayLogs(accounts), base = {}, have = {}, live = {}, acctLive = {}, changed = false;
    D.baseline.forEach(function (id) { base[id] = 1; });
    D.payments.forEach(function (p) { have[p.id] = p; });
    accounts.forEach(function (a) { acctLive[a.id] = 1; });
    logs.forEach(function (l) {
      live[l.id] = 1;
      if (base[l.id]) return;
      if (!have[l.id]) {
        D.payments.push({ id: l.id, acctId: l.acctId, name: l.name, date: l.date, vnd: l.vnd, week: l.week, off: false, ts: Date.now() });
        changed = true;

        have[l.id].vnd = l.vnd; have[l.id].name = l.name; changed = true;
      }
    });
    var keep = D.payments.filter(function (p) { return live[p.id] || !acctLive[p.acctId]; });
    if (keep.length !== D.payments.length) { D.payments = keep; changed = true; }
    return changed;

  /* ---- mục tiêu ---- */
  function goalById(id) { return find(D.goals, id); }

  function goalHave(id) {   /* id "" = Chung (chưa gắn / mục tiêu đã xoá) */
    var known = {}, v = 0; D.goals.forEach(function (g) { known[g.id] = 1; });
    function match(x) { return id ? x === id : !(x && known[x]); }
    D.withdrawals.forEach(function (w) { if (match(w.goalId)) v += wPart(w, "sav"); });
    D.savTx.forEach(function (t) { if (match(t.goalId)) v += (t.type === "out" ? -1 : 1) * num(t.vnd); });

  function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5); }
  /* ---- gửi ngân hàng: lãi kép, tự quay vòng, chỉ tính số kỳ TRỌN ---- */
  function addMonthsISO(iso, m) {
    var p = iso.split("-").map(Number), y = p[0], mo = p[1] - 1 + m, d = p[2];
    y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
    var last = new Date(y, mo + 1, 0).getDate();
    return y + "-" + pad(mo + 1) + "-" + pad(Math.min(d, last));
  }
  function fullMonths(a, b) {   /* số tháng tròn từ a đến b */
    if (!a || !b || b <= a) return 0;
    var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    var m = (pb[0] - pa[0]) * 12 + (pb[1] - pa[1]);
    if (addMonthsISO(a, m) > b) m--;
    return Math.max(0, m);
  }
  /* Cách ngân hàng tính: lãi mỗi kỳ = gốc × lãi suất năm × SỐ NGÀY THỰC của kỳ / 365.
     reinvest = true: lãi nhập gốc cho kỳ sau (lãi kép); false: chỉ quay vòng gốc. */
  function compound(P, rt, start, term, n, reinvest) {
    var bal = P, tot = 0, rows = [];
    for (var i = 1; i <= n; i++) {
      var a = addMonthsISO(start, (i - 1) * term), b = addMonthsISO(start, i * term), days = daysBetween(a, b);
      var it = Math.round((reinvest ? bal : P) * rt * days / 365);
      tot += it; if (reinvest) bal += it;
      rows.push({ i: i, from: a, to: b, days: days, interest: it, bal: reinvest ? bal : P + tot });
    }
    return { total: P + tot, interest: tot, rows: rows };
  }
  function depCalc(d, until) {
    var P = num(d.amt), term = Math.max(1, num(d.term)), rt = num(d.rate) / 100;
    var o = { term: term };
    o.months = until ? fullMonths(d.date, until) : 0;
    o.n = until ? Math.floor(o.months / term) : 0;
    o.final = compound(P, rt, d.date, term, o.n, true).total;
    o.interest = o.final - P;
    o.lastMat = o.n > 0 ? addMonthsISO(d.date, o.n * term) : "";
    o.firstDays = daysBetween(d.date, addMonthsISO(d.date, term));
    o.firstInt = Math.round(P * rt * o.firstDays / 365);
    var k = 1; while (addMonthsISO(d.date, k * term) <= todayISO() && k < 999) k++;
    o.nextMat = addMonthsISO(d.date, k * term);

  function goalDeps(id) { return D.deposits.filter(function (d) { return d.goalId === id; }); }

    o.left = Math.max(0, o.target - o.have);
    o.leftProj = Math.max(0, o.target - o.proj);
    o.pct = o.target > 0 ? Math.min(100, Math.max(0, o.have / o.target * 100)) : 0;
    o.pctProj = o.target > 0 ? Math.min(100, Math.max(0, o.proj / o.target * 100)) : 0;
    o.done = o.target > 0 && o.have >= o.target;

    rot: { name: "Xoay vòng vốn", c: "var(--blue)", cs: "var(--blue-s)", cb: "var(--blue-b)", ic: "rotate" },
    sav: { name: "Tiết kiệm", c: "var(--green)", cs: "var(--green-s)", cb: "var(--green-b)", ic: "piggy" },
    spd: { name: "Tiêu dùng", c: "var(--amber)", cs: "var(--amber-s)", cb: "var(--amber-b)", ic: "cart" }
  };

  function render() {
    document.getElementById("rateChip").textContent = NFV.format(rate());
    document.getElementById("eyeBtn").innerHTML = ic(UI.hide ? "eyeoff" : "eye");
    var ready = CFG.token && !ST.needSQL && D.startedAt;
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = ready ? TABS.map(function (t) {
      return '<button class="tab' + (UI.tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '" style="--tc:' + ({ home: "var(--carbon)", main: "var(--carbon)", wd: "var(--teal)", rot: "var(--blue)", spd: "var(--amber)", sav: "var(--green)", hist: "var(--ink2)" }[t[0]]) + '">' + ic(t[1], 16) + t[2] + "</button>";
    }).join("") : "";
    var v = document.getElementById("view");
    if (!CFG.token) v.innerHTML = viewLogin();
    else if (!ST.loaded) v.innerHTML = '<div class="card center" style="text-align:center">Đang tải dữ liệu…</div>';
    else if (ST.needSQL) v.innerHTML = viewSQL();
    else if (!D.startedAt) v.innerHTML = viewInit();
    else v.innerHTML = ({ home: viewHome, main: viewMain, wd: viewWd, rot: viewRot, spd: viewSpd, sav: viewSav, hist: viewHist }[UI.tab] || viewHome)();
    if (ready && UI.hide) v.innerHTML = '<button class="banner info" data-act="eye" style="width:100%;cursor:pointer">' + ic("eyeoff", 16) +
      '<span>Đang <b>ẩn số tiền</b>. Bấm vào đây (hoặc biểu tượng con mắt trên thanh trên cùng) để hiện lại.</span></button>' + v.innerHTML;
    paintIcons(document.body);
    bindMoney(v);
    wdPreview("w");
    kCalc();
  }

  function box(key, title, count, inner, defOpen) {
    var open = UI.open[key] === undefined ? !!defOpen : UI.open[key];
    return '<details class="box" data-key="' + key + '"' + (open ? " open" : "") + "><summary>" + title +
      (count != null ? ' <span class="cnt">(' + count + ")</span>" : "") + '<span class="chev">' + ic("chev") + "</span></summary>" +
      '<div class="body">' + inner + "</div></details>";
  }

  function moneyInput(id, val, cur, allowSwitch, rateFrom) {
    return '<div class="ig"><input class="in mono" id="' + id + '" inputmode="decimal" autocomplete="off" value="' + esc(fmtIn(val, cur)) + '" data-money="' + cur + '"' + (rateFrom ? ' data-ratefrom="' + rateFrom + '"' : "") + ' placeholder="0">' +
      (allowSwitch ? '<div class="seg" data-seg="' + id + '"><button type="button" data-cur="USD" class="' + (cur === "USD" ? "on" : "") + '">USD</button><button type="button" data-cur="VND" class="' + (cur === "VND" ? "on" : "") + '">VND</button></div>'
        : '<div class="seg"><button type="button" class="on" tabindex="-1">' + cur + "</button></div>") +
      '</div><div class="calc" id="' + id + '_c"></div>';
  }
  function curOf(id) { var el = document.getElementById(id); return el ? el.getAttribute("data-money") : "USD"; }
  function valOf(id) { var el = document.getElementById(id); return el ? parseAmt(el.value, curOf(id)) : 0; }
  function rateIn(id) { var el = document.getElementById(id); return el ? (parseAmt(el.value, "VND") || rate()) : rate(); }

  /* cập nhật dòng quy đổi dưới ô nhập tiền */
  function bindMoney(root) {
    root.querySelectorAll("[data-money]").forEach(function (el) { calcLine(el); });
  }
  function calcLine(el) {
    var id = el.id, cur = el.getAttribute("data-money"), c = document.getElementById(id + "_c");
    if (!c) return;
    var rf = el.getAttribute("data-ratefrom"), r = rf && document.getElementById(rf) ? rateIn(rf) : rate();
    var v = parseAmt(el.value, cur);
    c.textContent = v ? (cur === "USD" ? "= " + vnd(v * r, 1) : "= " + usd(v / r, 1)) : "";
    if (id === "wAmt" || id === "eAmt") wdPreview(id.charAt(0));
  }
  function wdPreview(px) {
    px = px || "w";
    var p = document.getElementById(px + "Prev"); if (!p) return;
    var pct = px === "e" && editingPct ? editingPct : D.split;
    var u = valOf(px + "Amt"), r = rateIn(px + "Rate"), tot = u * r, b = B();
    var html = "";
    ["rot", "sav", "spd"].forEach(function (k) {
      html += '<div style="border-left:3px solid ' + FUND[k].c + '"><div class="lbl">' + FUND[k].name + " · " + pct[k] + "%</div><b>" + vnd(tot * pct[k] / 100, 1) + "</b></div>";
    });
    p.innerHTML = html;
    var w = document.getElementById(px + "Warn");
    if (w) {
      var avail = b.mainUSD + num(document.getElementById(px + "Amt").getAttribute("data-old"));
      w.className = u > avail + 0.001 ? "banner info" : "hide";
      w.style.marginTop = "10px";
      w.innerHTML = ic("alert", 16) + "<span>Số rút lớn hơn Quỹ USD hiện có (" + usd(avail, 1) + "). Quỹ USD sẽ bị âm.</span>";
    }
  }

  /* ---------- đăng nhập / cài đặt lần đầu ---------- */
  function viewLogin() {
    var pre = CFG.email;
    if (!pre) { try { pre = JSON.parse(lsGet(OLD_CLOUD_KEY) || "{}").email || ""; } catch (e) {} }
    return '<div class="card center"><h2 style="margin:0 0 4px">Đăng nhập</h2>' +
      '<p class="hint" style="margin:0 0 6px">Dùng <b>cùng email và mật khẩu</b> với web Sổ thuê tài khoản để web này đọc được các lần thanh toán.</p>' +
      '<label class="fl" for="lEmail">Email</label><input class="in" id="lEmail" type="email" autocomplete="username" value="' + esc(pre) + '">' +
      '<label class="fl" for="lPass">Mật khẩu</label><input class="in" id="lPass" type="password" autocomplete="current-password">' +
      '<div style="margin-top:16px"><button class="btn primary block" data-act="login">Đăng nhập</button></div></div>';
  }
  function viewSQL() {
    return '<div class="card center" style="max-width:620px"><h2 style="margin:0 0 4px">Cài đặt lần đầu (1 lần duy nhất)</h2>' +
      '<p class="hint">Web cần một bảng riêng tên <b>funds</b> trên Supabase để lưu dữ liệu quỹ. Bảng của web Sổ thuê tài khoản <b>không bị đụng tới</b>.</p>' +
      '<div class="steps"><p><b>1.</b> Mở <a href="https://supabase.com/dashboard" target="_blank" rel="noopener">supabase.com/dashboard</a> → chọn đúng project đang dùng cho Sổ thuê tài khoản.</p>' +
      "<p><b>2.</b> Menu trái chọn <b>SQL Editor</b> → <b>New query</b>.</p>" +
      "<p><b>3.</b> Bấm <b>Sao chép SQL</b> bên dưới, dán vào ô soạn thảo rồi bấm <b>Run</b>. Thấy chữ <i>Success</i> là xong.</p>" +
      "<p><b>4.</b> Quay lại đây bấm <b>Tôi đã chạy xong</b>.</p></div>" +
      '<div class="sqlbox">' + esc(SQL) + "</div>" +
      '<div class="row" style="margin-top:14px"><button class="btn" data-act="copySQL">' + ic("copy", 16) + " Sao chép SQL</button>" +
      '<button class="btn primary sp" data-act="recheck">' + ic("check", 16) + " Tôi đã chạy xong</button></div></div>";
  }
  function viewInit() {
    return '<div class="card center" style="max-width:520px"><h2 style="margin:0 0 4px">Bắt đầu quỹ</h2>' +
      '<p class="hint" style="margin:0">Nhập số tiền <b>đang có</b> ở Quỹ USD. Ba quỹ con bắt đầu từ 0. Chỉ những lần thanh toán tick <b>từ bây giờ</b> bên Sổ thuê mới được trừ.</p>' +
      '<label class="fl" for="iRate">Tỷ giá (1 USD = ? VND)</label><input class="in mono" id="iRate" inputmode="numeric" value="' + NFV.format(rate()) + '" data-rate>' +
      '<label class="fl" for="iAmt">Số dư Quỹ USD hiện có</label>' + moneyInput("iAmt", 0, "USD", true, "iRate") +
      '<label class="fl" for="gAmt">Mục tiêu tiết kiệm (có thể để trống, đặt sau)</label>' + moneyInput("gAmt", 0, "VND", true) +
      '<div style="margin-top:16px"><button class="btn primary block" data-act="start">Bắt đầu từ hôm nay</button></div></div>';
  }

  /* ---------- Tổng quan ---------- */
  function fundCard(k, b) {
    var f = FUND[k], bal = b[k], extra = "";
    if (k === "rot") extra = '<div class="kv"><span>Đã được chia</span><b>' + vnd(b.rotIn) + '</b></div><div class="kv"><span>Đã trừ thanh toán</span><b>' + vnd(b.paid) + "</b></div>";
    if (k === "spd") extra = '<div class="kv"><span>Đã được chia</span><b>' + vnd(b.spdIn) + '</b></div><div class="kv"><span>Đã tiêu</span><b>' + vnd(b.spent) + "</b></div>";
    if (k === "sav") extra = (D.goals.length ? D.goals.map(function (g) {
        var c = goalCalc(g); return '<div class="mini"><span>' + esc(g.name) + '</span><div class="prog"><i style="width:' + c.pct.toFixed(1) + '%"></i></div><b class="mono">' + Math.floor(c.pct) + "%</b></div>";
      }).join("") : '<div class="kv"><span>Chưa có mục tiêu</span></div>') +
      '<div class="row" style="margin-top:8px;gap:6px"><button class="btn sm" data-act="savAdd">' + ic("plus", 14) + ' Thêm</button><button class="btn sm" data-act="savOut">' + ic("up", 14) + ' Rút</button><button class="btn sm" data-act="goSav">Mục tiêu</button></div>';
    return '<div class="card fund" style="--c:' + f.c + ";--cs:" + f.cs + ";--cb:" + f.cb + '"><div class="row"><span class="tag lbl" style="color:' + f.c + '">' + ic(f.ic, 15) + f.name + '</span><span class="pct sp">' + D.split[k] + "%</span></div>" +
      '<div class="mid' + (bal < 0 ? " neg" : "") + '" style="margin-top:6px">' + vnd(bal) + '</div><div class="sub">≈ ' + usd(bal / rate()) + "</div>" +
      '<div style="margin-top:10px">' + extra + "</div>" +
      (k === "rot" && bal < 0 ? '<div class="banner" style="margin-top:8px">' + ic("alert", 16) + "<span>Quỹ đang âm — cần rút thêm từ Quỹ USD.</span></div>" : "") +
      (k === "spd" ? '<button class="btn sm" style="margin-top:10px" data-act="spend">' + ic("cart", 15) + " Ghi khoản tiêu</button>" : "") +
      "</div>";
  }
  function viewHome() {
    var b = B();
    var hero = '<div class="card hero"><div class="row"><span class="lbl">Quỹ USD hiện có</span><span class="sub sp">1 USD = ' + NFV.format(rate()) + " ₫</span></div>" +
      '<div class="big' + (b.mainUSD < 0 ? " neg" : "") + '" style="margin-top:6px">' + usd(b.mainUSD) + '</div><div class="sub">≈ ' + vnd(b.mainUSD * rate()) + "</div>" +
      '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="receive">' + ic("down", 16) + " Nhận tiền</button>" +
      '<button class="btn" data-act="gowd">' + ic("split", 16) + " Rút & chia</button></div></div>";
    var funds = '<div class="grid">' + fundCard("rot", b) + fundCard("sav", b) + fundCard("spd", b) + "</div>";
    var tot = box("home-sum", "Tổng kết từ " + dmy(D.startedAt), null,
      '<div class="kv"><span>Tổng đã nhận</span><b>' + usd(b.recUSD) + "</b></div>" +
      '<div class="kv"><span>Tổng đã rút</span><b>' + usd(b.wdUSD) + " · " + vnd(b.wdVND) + "</b></div>" +
      '<div class="kv"><span>Tổng đã thanh toán (từ Sổ thuê)</span><b>' + vnd(b.paid) + "</b></div>" +
      '<div class="kv"><span>Tổng đã tiêu dùng</span><b>' + vnd(b.spent) + "</b></div>" +
      '<div class="kv"><span>Tổng 3 quỹ con hiện có</span><b>' + vnd(b.rot + b.sav + b.spd) + "</b></div>", true);
    var acts = activities().slice(0, 8);
    var recent = box("home-recent", "Hoạt động gần đây", null, acts.length ? acts.map(actRow).join("") : '<div class="empty">Chưa có hoạt động nào.</div>', false);
    return hero + funds + tot + recent + ledgerNote();
  }
  function ledgerNote() {
    return '<div class="row" style="justify-content:center;color:var(--muted);font-size:12px">' + ic("link", 14) +
      (ST.ledgerErr ? '<span class="neg">Không đọc được Sổ thuê: ' + esc(ST.ledgerErr) + "</span>" : "<span>Thanh toán lấy tự động từ Sổ thuê" + (ST.ledgerAt ? " · kiểm tra lúc " + ST.ledgerAt : "") + "</span>") +
      '<button class="btn sm" data-act="ledger">Kiểm tra ngay</button></div>';
  }

  /* ---------- hoạt động (dùng chung) ---------- */
  function activities() {
    var a = [];
    if (D.init) a.push({ t: "init", date: D.init.date || D.startedAt.slice(0, 10), ts: 0, o: D.init });
    D.receipts.forEach(function (r) { a.push({ t: "rec", date: r.date, ts: r.ts || 0, o: r }); });
    D.withdrawals.forEach(function (w) { a.push({ t: "wd", date: w.date, ts: w.ts || 0, o: w }); });
    D.payments.forEach(function (p) { a.push({ t: "pay", date: p.date, ts: p.ts || 0, o: p }); });
    D.spends.forEach(function (s) { a.push({ t: "spd", date: s.date, ts: s.ts || 0, o: s }); });
    D.savTx.forEach(function (s) { a.push({ t: "sav", date: s.date, ts: s.ts || 0, o: s }); });
    return a.sort(function (x, y) { return x.date < y.date ? 1 : x.date > y.date ? -1 : (y.ts - x.ts); });
  }
  function actRow(a) {
    var o = a.o, r = rate();
    if (a.t === "init") return li("wallet", "var(--carbon-s)", "var(--carbon)", "Số dư ban đầu", dmy(a.date), usd(initUSD()), o.cur === "VND" ? vnd(o.amt) : vnd(initUSD() * r), "init", "init");
    if (a.t === "rec") return li("down", "var(--green-s)", "var(--green)", "Nhận tiền" + (o.note ? " · " + esc(o.note) : ""), dmy(o.date), "+" + usd(o.usd), "≈ " + vnd(o.usd * r), "rec", o.id);
    if (a.t === "wd") return li("split", "var(--teal-s)", "var(--teal)", "Rút & chia" + (o.note ? " · " + esc(o.note) : "") + " · TK → " + esc(goalName(o.goalId)),
      dmy(o.date) + " · " + NFV.format(o.rate) + " ₫/$ · " + o.pct.rot + "/" + o.pct.sav + "/" + o.pct.spd, "−" + usd(o.usd), vnd(wVND(o)), "wd", o.id);
    if (a.t === "pay") return li("rotate", "var(--blue-s)", "var(--blue)", "Thanh toán · " + esc(o.name) + (o.week ? " · tuần " + o.week + "/4" : ""),
      dmy(o.date) + " · trừ Xoay vòng" + (o.off ? " · không tính" : ""), "−" + vnd(o.vnd), "≈ " + usd(o.vnd / r), "pay", o.id, o.off);
    if (a.t === "sav") return o.type === "out"
      ? li("up", "var(--red-s)", "var(--red)", "Rút tiết kiệm · " + esc(goalName(o.goalId)) + (o.note ? " · " + esc(o.note) : ""), dmy(o.date), "−" + vnd(o.vnd), "≈ " + usd(o.vnd / r), "sav", o.id)
      : li("piggy", "var(--green-s)", "var(--green)", "Thêm tiết kiệm · " + esc(goalName(o.goalId)) + (o.note ? " · " + esc(o.note) : ""), dmy(o.date), "+" + vnd(o.vnd), "≈ " + usd(o.vnd / r), "sav", o.id);
    return li("cart", "var(--amber-s)", "var(--amber)", "Tiêu dùng" + (o.note ? " · " + esc(o.note) : ""), dmy(o.date), "−" + vnd(o.vnd), "≈ " + usd(o.vnd / r), "spd", o.id);
  }
  function li(icn, bg, fg, t1, t2, amt, amt2, kind, id, off) {
    var acts = kind === "pay"
      ? '<button class="icon" data-act="toggle" data-id="' + id + '" title="' + (off ? "Tính lại khoản này" : "Không tính khoản này") + '">' + ic(off ? "plus" : "eyeoff", 16) + "</button>"
      : '<button class="icon" data-act="edit" data-kind="' + kind + '" data-id="' + id + '" title="Sửa">' + ic("edit", 16) + "</button>" +
        (kind !== "init" ? '<button class="icon" data-act="del" data-kind="' + kind + '" data-id="' + id + '" title="Xoá">' + ic("trash", 16) + "</button>" : "");
    return '<div class="li' + (off ? " off" : "") + '"><span class="ico" style="background:' + bg + ";color:" + fg + '">' + ic(icn, 16) + "</span>" +
      '<div class="t"><div class="t1">' + t1 + '</div><div class="t2">' + t2 + "</div></div>" +
      '<div class="amt">' + amt + "<small>" + amt2 + '</small></div><div class="acts">' + acts + "</div></div>";
  }
  function listOf(kind) { return activities().filter(function (a) { return kind.indexOf(a.t) > -1; }); }

  /* ---------- Quỹ USD ---------- */
  function viewMain() {
    var b = B(), rec = listOf(["rec", "init"]), wd = listOf(["wd"]);
    return '<div class="card hero"><span class="lbl">Quỹ USD hiện có</span><div class="big' + (b.mainUSD < 0 ? " neg" : "") + '" style="margin-top:6px">' + usd(b.mainUSD) + "</div>" +
      '<div class="sub">≈ ' + vnd(b.mainUSD * rate()) + '</div><div class="row" style="margin-top:14px"><button class="btn primary" data-act="receive">' + ic("down", 16) + " Nhận tiền</button>" +
      '<button class="btn" data-act="gowd">' + ic("split", 16) + " Rút & chia</button></div></div>" +
      '<div class="card"><div class="kv" style="border:none"><span>Số dư ban đầu</span><b>' + usd(b.initUSD) + '</b></div><div class="kv"><span>+ Tổng đã nhận</span><b class="pos">' + usd(b.recUSD) +
      '</b></div><div class="kv"><span>− Tổng đã rút</span><b>' + usd(b.wdUSD) + '</b></div><div class="kv"><span>= Hiện có</span><b>' + usd(b.mainUSD) + "</b></div></div>" +
      box("main-rec", "Các lần nhận tiền", rec.length, rec.map(actRow).join("") || '<div class="empty">Chưa có.</div>', true) +
      box("main-wd", "Các lần rút", wd.length, wd.map(actRow).join("") || '<div class="empty">Chưa rút lần nào.</div>', false);
  }

  /* ---------- Rút & chia ---------- */
  function viewWd() {
    var b = B(), wd = listOf(["wd"]);
    var form = '<div class="card"><div class="row"><h3 style="margin:0">Rút tiền từ Quỹ USD</h3><span class="sub sp">Có: ' + usd(b.mainUSD) + "</span></div>" +
      '<label class="fl" for="wAmt">Số tiền rút</label>' + moneyInput("wAmt", 0, "USD", false, "wRate") +
      '<div class="row" style="gap:8px"><div style="flex:1;min-width:140px"><label class="fl" for="wRate">Tỷ giá lúc rút</label><input class="in mono" id="wRate" inputmode="numeric" value="' + NFV.format(rate()) + '" data-rate></div>' +
      '<div style="flex:1;min-width:140px"><label class="fl" for="wDate">Ngày</label><input class="in" id="wDate" type="date" value="' + todayISO() + '"></div></div>' +
      '<label class="fl" for="wGoal">Phần tiết kiệm (' + D.split.sav + '%) đưa vào mục tiêu</label><select class="in" id="wGoal">' + goalOptions(defGoal()) + "</select>" +
      '<label class="fl" for="wNote">Ghi chú</label><input class="in" id="wNote" placeholder="không bắt buộc">' +
      '<div class="split3" id="wPrev"></div><div id="wWarn" class="hide"></div>' +
      '<div style="margin-top:14px"><button class="btn primary block" data-act="withdraw">' + ic("split", 16) + " Rút và chia vào 3 quỹ</button></div>" +
      '<p class="hint">Tỷ lệ chia hiện tại ' + D.split.rot + "/" + D.split.sav + "/" + D.split.spd + ' — đổi trong <a href="#" data-act="settings">Cài đặt</a>.</p></div>';
    var totals = '<div class="grid">' + ["rot", "sav", "spd"].map(function (k) {
      return '<div class="card fund" style="--c:' + FUND[k].c + ";--cs:" + FUND[k].cs + ";--cb:" + FUND[k].cb + '"><span class="lbl" style="color:' + FUND[k].c + '">Tổng đã chia · ' + FUND[k].name + '</span><div class="mid" style="margin-top:4px">' + vnd(b[k + "In"]) + "</div></div>";
    }).join("") + "</div>";
    return form + totals + box("wd-list", "Lịch sử rút", wd.length, wd.map(function (a) {
      var w = a.o;
      return actRow(a) + '<div class="t2" style="padding:0 0 8px 42px;color:var(--muted);font-size:12px;font-family:var(--mono)">→ ' +
        "XV " + vnd(wPart(w, "rot")) + " · TK " + vnd(wPart(w, "sav")) + " · TD " + vnd(wPart(w, "spd")) + "</div>";
    }).join("") || '<div class="empty">Chưa rút lần nào.</div>', true);
  }

  /* ---------- Xoay vòng ---------- */
  function viewRot() {
    var b = B(), pays = listOf(["pay"]);
    return '<div class="grid">' + fundCard("rot", b) +

      '<p class="hint">Mỗi lần bạn tick "đã trả" bên Sổ thuê tài khoản, khoản đó tự trừ vào Xoay vòng vốn. Hoàn tác bên đó thì khoản trừ cũng tự mất. Bấm ' + ic("eyeoff", 12) + " để bỏ không tính một khoản.</p></div></div>" +
      box("rot-pay", "Các lần thanh toán", pays.length, pays.map(actRow).join("") || '<div class="empty">Chưa có thanh toán nào từ ngày bắt đầu.</div>', true) + ledgerNote();

  /* ---------- Tiêu dùng ---------- */

  /* ---------- Tiết kiệm ---------- */
  function depRow(d, g) {

    var line3 = g.deadline
      ? (c.n > 0 ? c.n + " kỳ trọn đến hạn mục tiêu (kỳ cuối " + dmy(c.lastMat) + ") · lãi +" + vnd(c.interest) + " → " + vnd(c.final)
        : "Chưa đủ 1 kỳ trọn trước hạn mục tiêu → lãi 0")

      '<div class="t"><div class="t1">' + esc(d.bank || "Sổ tiết kiệm") + ' · <span class="mono">' + vnd(d.amt) + '</span></div><div class="t2">' + line2 + '</div><div class="t2" style="color:var(--green)">' + line3 + "</div></div>" +
      '<div class="acts"><button class="icon" data-act="depEdit" data-id="' + d.id + '" title="Sửa">' + ic("edit", 16) + '</button><button class="icon" data-act="depDel" data-id="' + d.id + '" title="Xoá">' + ic("trash", 16) + "</button></div></div>";

  function goalCard(g) {
    var c = goalCalc(g), r = rate();
    var badge = c.done ? '<span class="badge ok">Đã đạt</span>' : (g.deadline ? (c.days > 0 ? '<span class="badge">Còn ' + c.days + " ngày</span>" : '<span class="badge late">' + (c.days === 0 ? "Hạn hôm nay" : "Quá hạn " + (-c.days) + " ngày") + "</span>") : '<span class="badge">Không đặt hạn</span>');
    var need = "";
    if (!c.done && !c.doneProj) {
      if (g.deadline && c.days > 0) {
        need = '<div class="need"><div><div class="lbl">Mỗi ngày</div><b>' + vnd(c.perDay) + "</b><small>" + usd(c.perDay / r) + "</small></div>" +
          '<div><div class="lbl">Mỗi tuần</div><b>' + vnd(c.perWeek) + "</b><small>" + usd(c.perWeek / r) + "</small></div>" +
          '<div><div class="lbl">Mỗi tháng</div><b>' + vnd(c.perMonth) + "</b><small>" + usd(c.perMonth / r) + "</small></div></div>";
      }
      need += '<p class="hint">Cần rút thêm khoảng <b>' + usd(c.needUSD) + "</b> từ Quỹ USD (với " + D.split.sav + "% vào tiết kiệm) để đủ mục tiêu" +
        (c.interest > 0 ? " (đã trừ lãi dự kiến)" : "") +
        (g.deadline && c.days > 0 ? ", tức ~<b>" + usd(c.needUSD / (c.days / 30 < 1 ? 1 : c.days / 30)) + "/tháng</b>" : "") + ".</p>";
    }
    var proj = c.deps.length && g.deadline
      ? '<div class="proj"><div class="kv" style="border:none;padding:0"><span>Dự kiến đến ' + dmy(g.deadline) + " (gồm lãi)</span><b>" + vnd(c.proj) + "</b></div>" +
        '<div class="kv" style="border:none;padding:2px 0 0"><span>Lãi dự kiến</span><b class="pos">+' + both(c.interest) + "</b></div>" +
        '<div class="kv" style="border:none;padding:2px 0 0"><span>' + (c.doneProj ? "Dự kiến dư" : "Còn thiếu sau lãi") + "</span><b>" + both(c.doneProj ? c.proj - c.target : c.leftProj) + "</b></div></div>"
      : "";
    var warn = c.depSum > c.have + 0.5 ? '<div class="banner info" style="margin-top:8px">' + ic("alert", 16) + "<span>Tổng tiền gửi (" + vnd(c.depSum) + ") lớn hơn số đang có của mục tiêu (" + vnd(c.have) + ").</span></div>" : "";
    var deps = '<div class="dep"><div class="row"><span class="lbl">Gửi ngân hàng (' + c.deps.length + ")</span>" +
      (c.deps.length ? '<span class="sub">' + vnd(c.depSum) + "</span>" : "") +
      '<button class="btn sm sp" data-act="depNew" data-id="' + g.id + '">' + ic("plus", 14) + " Thêm sổ gửi</button></div>" +
      c.deps.map(function (d) { return depRow(d, g); }).join("") + warn + "</div>";
    return '<div class="goal' + (c.done ? " done" : "") + '"><div class="gh"><h4>' + esc(g.name) + "</h4>" + badge +
      '<span class="acts"><button class="icon" data-act="goalEdit" data-id="' + g.id + '" title="Sửa">' + ic("edit", 16) + '</button><button class="icon" data-act="goalDel" data-id="' + g.id + '" title="Xoá">' + ic("trash", 16) + "</button></span></div>" +
      (g.note ? '<div class="t2" style="color:var(--muted);font-size:12px">' + esc(g.note) + "</div>" : "") +
      '<div class="row" style="margin-top:8px;align-items:baseline"><span class="mid">' + vnd(c.have) + '</span><span class="sub">/ ' + vnd(c.target) + (g.cur === "USD" ? " (" + usd(g.amt) + ")" : "") + "</span></div>" +
      '<div class="prog">' + (c.interest > 0 ? '<i class="pj" style="width:' + c.pctProj.toFixed(1) + '%"></i>' : "") + '<i style="width:' + c.pct.toFixed(1) + '%"></i></div>' +
      '<div class="kv" style="border:none"><span>Đạt ' + c.pct.toFixed(1) + "%" + (c.interest > 0 ? " (" + c.pctProj.toFixed(1) + "% gồm lãi)" : "") + (g.deadline ? " · hạn " + dmy(g.deadline) : "") + "</span><b>" + (c.done ? "Dư " + both(c.have - c.target) : "Còn thiếu " + both(c.left)) + "</b></div>" +
      proj + need + deps +
      '<div class="row" style="gap:6px;margin-top:10px"><button class="btn sm" data-act="savAdd" data-id="' + g.id + '">' + ic("plus", 14) + ' Thêm</button><button class="btn sm" data-act="savOut" data-id="' + g.id + '">' + ic("up", 14) + " Rút</button></div></div>";
  }
  /* ---- máy tính lãi tiền gửi (chỉ tính, không lưu dữ liệu) ---- */
  var KC = { amt: 100000000, rate: 6, term: 6, dur: 12, mode: "comp", date: "" };
  try { var k0 = JSON.parse(lsGet("quy-calc-v1") || "null"); if (k0) for (var kk in KC) if (k0[kk] !== undefined) KC[kk] = k0[kk]; } catch (e) {}
  function calcBox() {
    var terms = [1, 2, 3, 6, 9, 12, 13, 18, 24, 36];
    var inner = '<div class="kgrid" id="kcalc">' +
      '<div><label class="fl" for="kAmt">Số tiền gửi</label>' + moneyInput("kAmt", KC.amt, "VND", false) + "</div>" +
      '<div><label class="fl" for="kRate">Lãi suất (%/năm)</label><input class="in mono" id="kRate" inputmode="decimal" value="' + KC.rate + '"></div>' +
      '<div><label class="fl" for="kTerm">Kỳ hạn</label><select class="in" id="kTerm">' + terms.map(function (t) { return '<option value="' + t + '"' + (t === num(KC.term) ? " selected" : "") + ">" + t + " tháng</option>"; }).join("") + "</select></div>" +
      '<div><label class="fl" for="kDur">Tổng thời gian gửi (tháng)</label><input class="in mono" id="kDur" inputmode="numeric" value="' + KC.dur + '"' + (KC.mode === "none" ? " disabled" : "") + '></div>' +
      '<div><label class="fl" for="kDate">Ngày gửi</label><input class="in" id="kDate" type="date" value="' + (KC.date || todayISO()) + '"></div>' +
      "</div>" +
      '<label class="fl">Khi đến hạn</label><div class="mseg" id="kMode">' +
      [["comp", "Quay vòng gốc + lãi"], ["prin", "Quay vòng gốc, rút lãi"], ["none", "Không tái tục"]].map(function (m) {
        return '<button type="button" data-kmode="' + m[0] + '" class="' + (KC.mode === m[0] ? "on" : "") + '">' + m[1] + "</button>"; }).join("") + "</div>" +
      '<div id="kOut"></div>';
    return box("sav-calc", ic("coins", 16) + " Máy tính lãi tiền gửi", null, inner, true).replace('class="box"', 'class="box calcbox"');
  }
  function kCalc() {
    var out = document.getElementById("kOut"); if (!out) return;
    KC.amt = valOf("kAmt"); KC.rate = parseAmt(val("kRate"), "USD"); KC.term = num(val("kTerm")) || 6;
    KC.dur = Math.max(0, Math.floor(num(val("kDur")))); KC.date = val("kDate") || todayISO();
    lsSet("quy-calc-v1", JSON.stringify(KC));
    var P = KC.amt, m = KC.term, rt = KC.rate / 100;
    if (!(P > 0) || !(KC.rate > 0)) { out.innerHTML = '<p class="hint">Nhập số tiền và lãi suất để xem kết quả.</p>'; return; }
    var n = KC.mode === "none" ? 1 : Math.floor(KC.dur / m);
    var odd = KC.mode === "none" ? 0 : KC.dur - n * m;
    if (n < 1) { out.innerHTML = '<div class="banner info" style="margin-top:12px">' + ic("alert", 16) + "<span>Tổng thời gian gửi ngắn hơn 1 kỳ hạn (" + m + " tháng) nên chưa có kỳ nào trọn để tính lãi.</span></div>"; return; }
    var cp = compound(P, rt, KC.date, m, n, KC.mode === "comp"), totInt = cp.interest, rows = "";
    cp.rows.slice(0, 120).forEach(function (x) {
      rows += "<tr><td>Kỳ " + x.i + "</td><td>" + dmy(x.to) + "</td><td>" + x.days + '</td><td class="g">+' + NFV.format(x.interest) + "</td><td>" + NFV.format(x.bal) + "</td></tr>";
    });
    var total = P + totInt, mat = addMonthsISO(KC.date, n * m), r = rate();
    var eff = (Math.pow(total / P, 12 / (n * m)) - 1) * 100;
    out.innerHTML = '<div class="kres"><div class="lbl">Nhận về ngày ' + dmy(mat) + " (sau " + n * m + " tháng)</div>" +
      '<div class="big" style="margin-top:4px">' + vnd(total, 1) + '</div><div class="sub">≈ ' + usd(total / r, 1) + "</div>" +
      '<div class="kstats"><div><small>Tiền lãi</small><b>+' + vnd(totInt, 1) + "</b></div>" +
      "<div><small>Số kỳ trọn</small><b>" + n + " kỳ × " + m + " th</b></div>" +
      "<div><small>Lãi mỗi kỳ" + (KC.mode === "comp" ? " (kỳ đầu)" : "") + "</small><b>" + vnd(cp.rows[0].interest, 1) + "</b></div>" +
      "<div><small>Lãi suất thực/năm</small><b>" + eff.toFixed(2) + "%</b></div></div></div>" +
      (odd > 0 ? '<p class="hint">' + odd + " tháng lẻ còn lại không đủ 1 kỳ nên không tính lãi.</p>" : "") +
      '<p class="hint">Công thức ngân hàng: lãi mỗi kỳ = số dư × ' + KC.rate + '% × số ngày thực của kỳ / 365. Kỳ 1: ' + NFV.format(KC.mode === "comp" ? P : P) + " × " + KC.rate + "% × " + cp.rows[0].days + "/365 = " + NFV.format(cp.rows[0].interest) + " ₫.</p>" +
      (KC.mode === "prin" ? '<p class="hint">Lãi được rút ra mỗi kỳ, không nhập gốc — tổng trên = gốc + tổng lãi đã nhận.</p>' : "") +
      '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--pink)">Xem chi tiết từng kỳ</summary>' +
      '<table class="ktab"><thead><tr><th>Kỳ</th><th>Đáo hạn</th><th>Ngày</th><th>Lãi</th><th>Số dư</th></tr></thead><tbody>' + rows + "</tbody></table></details>";
  }

  function viewSav() {

    var top = '<div class="card fund" style="--c:var(--green);--cs:var(--green-s);--cb:var(--green-b)"><div class="row"><span class="tag lbl" style="color:var(--green)">' + ic("piggy", 15) + 'Tổng tiết kiệm</span><span class="pct sp">' + D.split.sav + "%</span></div>" +

    });
    return top + calcBox() + goals + box("sav-list", "Lịch sử tiết kiệm", hist.length, hist.join("") || '<div class="empty">Chưa có.</div>', false);
  }

      inp.setAttribute("data-money", cur); inp.value = fmtIn(old, cur);
      box.querySelectorAll("button").forEach(function (b) { b.className = b === sg ? "on" : ""; });
      calcLine(inp); return;
    }
    var a = ev.target.closest("[data-act]");
    if (a && ACT[a.getAttribute("data-act")]) {
      if (a.getAttribute("data-act") === "ovclose" && ev.target !== a) return;
      ACT[a.getAttribute("data-act")](a, ev);
    }
  });
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.closest && el.closest("#kcalc")) kCalc();
    if (el.hasAttribute && el.hasAttribute("data-money")) calcLine(el);
    if (el.hasAttribute && el.hasAttribute("data-rate")) {
      document.querySelectorAll('[data-ratefrom="' + el.id + '"]').forEach(calcLine);
    }
  });
  /* tự thêm dấu chấm ngăn cách khi nhập VND / tỷ giá */
  document.addEventListener("blur", function (ev) {
    var el = ev.target;
    if (!el.hasAttribute) return;
    if (el.hasAttribute("data-rate") || el.getAttribute("data-money") === "VND") {
      var v = parseAmt(el.value, "VND"); if (v) el.value = NFV.format(v);
    }
  }, true);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeModal();
    if (ev.key === "Enter" && ev.target.id === "lPass") ACT.login(document.querySelector('[data-act="login"]'));
  });
  document.addEventListener("toggle", function (ev) {
    var d = ev.target; if (d.tagName === "DETAILS" && d.getAttribute("data-key")) { UI.open[d.getAttribute("data-key")] = d.open; saveUI(); }
  }, true);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && CFG.token && ST.loaded) pullFunds().then(function () { render(); syncLedger(); });
  });
  setInterval(function () { if (!document.hidden && CFG.token && ST.loaded && D.startedAt) syncLedger(); }, 60000);

  /* ============ khởi động ============ */
  function boot() {
    if (!CFG.token) { ST.loaded = true; render(); return Promise.resolve(); }
    loadLocal(); render();
    return pullFunds().then(function () {
      ST.loaded = true; render();
      if (D.startedAt && !ST.needSQL) return syncLedger();
    }).catch(function () { ST.loaded = true; render(); });
  }
  setSync("off", CFG.token ? "Đang kết nối…" : "Chưa đăng nhập");
  boot();
})();
</script>
</body>
</html>
